name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore systemd-service-monitor.sln

    - name: Build
      run: dotnet build systemd-service-monitor.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test systemd-service-monitor.sln --no-build --configuration Release --verbosity normal
